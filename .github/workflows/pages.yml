name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Node.js for tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check background.js
          node --check content.js
          node --check popup.js
      - name: Run extension unit tests
        run: node tests/background_test.cjs
      - name: Verify publish package metadata
        run: python tests/publish_package_test.py
      - name: Build Pages site and installable ZIP
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: python scripts/build_site.py
      - name: Verify site and download assets
        run: python tests/site_build_test.py
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
      - name: Upload extension ZIP as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-v3.0.0
          path: dist/target-tab-auto-clicker-v3.0.0.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
